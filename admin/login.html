<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Goldtech Graphics Admin Panel</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    body {
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 1.5rem;
      z-index: 10;
    }
    .login-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-color), #fbbf24);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h2 {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.6rem;
      margin-top: 0.5rem;
    }
    .login-header p {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-top: 0.25rem;
    }
    .error-msg {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
      text-align: center;
    }
    /* Simple background decorations */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 1;
    }
    .circle-1 {
      width: 300px;
      height: 300px;
      background-color: rgba(245, 158, 11, 0.05);
      top: -10%;
      right: -10%;
    }
    .circle-2 {
      width: 250px;
      height: 250px;
      background-color: rgba(245, 158, 11, 0.03);
      bottom: -5%;
      left: -5%;
    }
  </style>
</head>
<body>
  <div class="bg-circle circle-1"></div>
  <div class="bg-circle circle-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-icon" style="margin: 0 auto 0.75rem auto;">G</div>
        <h2>Admin Console</h2>
        <p>Sign in to manage Goldtech Graphics</p>
      </div>

      <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem;">
          <span>Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Redirect if already authenticated
    fetch('/api/auth-status')
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) {
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect') || '/admin/index.html';
          window.location.href = redirect;
        }
      });

    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        if (response.ok) {
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect') || '/admin/index.html';
          window.location.href = redirect;
        } else {
          const data = await response.json();
          errorMsg.textContent = data.error || 'Authentication failed.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Server connection error. Please try again.';
        errorMsg.style.display = 'block';
        console.error(err);
      }
    });
  </script>
</body>
</html>
